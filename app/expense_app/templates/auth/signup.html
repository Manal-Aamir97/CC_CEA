{% extends "layout_auth.html" %}
{% block title %}Create an account | Khata Expense Tracker{% endblock %}
{% block card %}
<h1>Open your khata</h1>
<p class="sub">It's free and takes about a minute.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Your name
    <input type="text" name="name" value="{{ form.get('name', '') }}" maxlength="80" autocomplete="name" required autofocus>
  </label>
  <label>Email
    <input type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
  </label>
  <label><span class="lbl">Password<span class="hint">At least 8 characters</span></span>
    <input type="password" name="password" minlength="8" autocomplete="new-password" required>
  </label>
  <label>Confirm password
    <input type="password" name="confirm" minlength="8" autocomplete="new-password" required>
  </label>
  <label>Currency
    <select name="currency">
      {% for c in currencies %}<option value="{{ c }}" {% if c == form.get('currency') %}selected{% endif %}>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label class="check"><input type="checkbox" name="sample" value="1" {% if form.get('sample') %}checked{% endif %}> Start with three months of sample expenses so I can look around</label>
  <button class="btn btn-khata" type="submit">Create account</button>
</form>
<p class="switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
