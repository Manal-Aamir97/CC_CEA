{% extends "layout_app.html" if g.user else "layout_public.html" %}
{% block title %}{{ title }} | Khata Expense Tracker{% endblock %}
{% block main %}
<div class="wrap error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-khata" href="{{ url_for('main.dashboard') if g.user else url_for('main.landing') }}">{{ "Go to your dashboard" if g.user else "Go to the home page" }}</a>
</div>
{% endblock %}
