# ---------- Web tier: Nginx ----------
# Serves static assets itself and reverse-proxies everything else to the
# application container ("app") on the private Docker network. The app
# container publishes no port to the host, so it is reachable only via Nginx.

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 6m;          # receipts up to 5 MB + form overhead

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Static assets are served directly by the web tier (cached by browsers)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Liveness of the web tier alone (used by the Docker HEALTHCHECK)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else goes to the application tier
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
